
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>综合性能分析工具</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: block;
            padding: 20px;
        }
        .tool-container {
            width: 100%;
            max-width: 800px;
            background-color: #f9f9f9;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            font-size: 14px;
            text-align: left;
            margin-bottom: 20px;
        }
        .tool-container h2 {
            font-size: 18px;
            text-align: left;
        }
        .form-group {
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        label {
            font-weight: bold;
            font-size: 14px;
            width: 50%;
        }
        input[type="number"] {
            padding: 6px;
            width: 80%;
            font-size: 14px;
            border-radius: 6px;
            border: 1px solid #ddd;
        }
        button {
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            width: auto;
            margin-top: 10px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .output {
            background: #f0f0f0;
            padding: 8px;
            margin-top: 15px;
            border-radius: 8px;
            white-space: pre-wrap;
        }
        .standard-info {
            cursor: pointer;
            color: #007BFF;
            text-decoration: underline;
        }
        .standard-details {
            display: none;
            margin-top: 10px;
            background-color: #f1f1f1;
            padding: 10px;
            border-radius: 5px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid #ccc;
            padding: 6px;
            text-align: left;
        }
        th {
            background-color: #f8f8f8;
        }
    </style>
</head>
<body>

<div class="tool-container">
    <h2>📶 带宽对比评估工具</h2>

    <div class="form-group">
        <label for="recvInput">请输入 JMeter 报告中的接收 KB/s（下载）：</label>
        <input type="number" id="recvInput" placeholder="例如：24.42">
    </div>

    <div class="form-group">
        <label for="sendInput">请输入 JMeter 报告中的发送 KB/s（上传）：</label>
        <input type="number" id="sendInput" placeholder="例如：8.14">
    </div>

    <div class="form-group">
        <label for="dlMbpsInput">请输入测速网站的下载速度（Mbps）：</label>
        <input type="number" id="dlMbpsInput" placeholder="例如：243">
    </div>

    <div class="form-group">
        <label for="ulMbpsInput">请输入测速网站的上传速度（Mbps）：</label>
        <input type="number" id="ulMbpsInput" placeholder="例如：66">
    </div>

    <div class="form-group">
        <label>测速网站结果链接：</label>
        <a href="https://www.speedtest.net/result/17637806687" target="_blank" style="color:#007bff;">点击查看你的网络测速结果</a>
    </div>

    <details style="margin-top: 10px;">
        <summary style="color: #000; font-weight: bold;">📘 Mbps 与 KB/s 单位换算说明（点击展开）</summary>
        <div style="padding: 10px 0 0 0;">
            <ul>
                <li>1 Mbps = 1,000,000 bits/s</li>
                <li>1 Byte = 8 bits</li>
                <li>所以 1 Mbps = 125,000 Bytes/s ≈ <strong>125 KB/s</strong></li>
                <li>例如：10 Mbps = 1250 KB/s</li>
            </ul>
        </div>
    </details>

    <div style="margin-top: 15px; display: flex; align-items: center; gap: 10px;">
        <button onclick="compareBandwidth()" id="analyzeBtn">📊 开始分析</button>
        <span style="font-size: 12px; color: #555;"><strong>点击按钮进行带宽使用率分析，判断是否存在网络瓶颈</strong></span>
    </div>

    <div class="output" id="output"></div>
</div>

<div class="tool-container">
    <h2>API 性能测试分析工具</h2>

    <div class="form-group">
        <label for="api_response_time">API 响应时间 (毫秒):</label>
        <input type="number" id="api_response_time" placeholder="输入 API 响应时间" required>
    </div>
    <div class="form-group">
        <label for="api_throughput">API 吞吐量 (次/秒)：<br><span style="font-weight: normal; color: gray;">（TPS，即每秒成功处理请求的次数）</span></label>
        <input type="number" id="api_throughput" placeholder="输入 API 吞吐量" required>
    </div>
    <div class="form-group">
        <label for="api_concurrent_users">API 并发用户数:</label>
        <input type="number" id="api_concurrent_users" placeholder="输入 API 并发用户数" required>
    </div>
    <div class="form-group">
        <label for="api_error_rate">API 错误率 (%):</label>
        <input type="number" id="api_error_rate" placeholder="输入 API 错误率" required>
    </div>
</div>
</body>
</html>
